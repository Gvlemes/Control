<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estación de Control - Robot de Rescate (Medición de Distancia)</title>
  
  <!-- Carga de librería local offline -->
  <script src="js/face-api.min.js"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 1000px; }
    .header-input { display: flex; gap: 10px; margin-bottom: 15px; }
    input[type="text"] {
      flex: 1; padding: 10px; border-radius: 6px;
      border: 1px solid #334155; background: #1e293b; color: #fff;
    }
    button {
      padding: 10px 20px; border-radius: 6px; border: none;
      background: #2563eb; color: #fff; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .alert-banner {
      padding: 12px; border-radius: 6px; text-align: center;
      font-weight: bold; margin-bottom: 15px;
      font-size: 1.1rem;
    }
    .status-green { background: #15803d; color: #fff; }
    .status-yellow { background: #a16207; color: #fff; }
    .status-red { background: #b91c1c; color: #fff; }
    
    .video-container {
      position: relative; width: 100%; height: 500px;
      background: #000; border-radius: 8px; overflow: hidden;
      display: flex; justify-content: center; align-items: center;
    }
    img.stream-img { width: 100%; height: 100%; object-fit: contain; display: block; }
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; }

    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
    .btn-ia { background: #334155; }
    .btn-ia.active { background: #059669; }
  </style>
</head>
<body>

<div class="container">
  <h2>Robot de Rescate - Telemetría y Distancia Estimada</h2>
  
  <div class="header-input">
    <input type="text" id="ipAddress" placeholder="192.168.1.10:8080/video o 192.168.4.1:81/stream">
    <button onclick="conectarStream()">Conectar Video</button>
  </div>

  <div id="bannerAlerta" class="alert-banner status-green">🟢 ESTADO: PATRULLAJE NORMAL</div>

  <div class="video-container" id="stage">
    <img id="mjpegStream" class="stream-img" crossorigin="anonymous" src="" alt="Esperando video de la cámara...">
  </div>

  <div class="controls">
    <button id="btnObj" class="btn-ia" onclick="toggleIA('objetos')">ZONA / RANGOS [OFF]</button>
    <button id="btnPos" class="btn-ia" onclick="toggleIA('postura')">ROSTRO / DISTANCIA [OFF]</button>
    <button id="btnEmo" class="btn-ia" onclick="toggleIA('emocion')">EMOCIÓN [OFF]</button>
  </div>

  <!-- Teclado de control de motores -->
  <div class="controls" style="margin-top: 20px;">
    <div></div><button onclick="enviarCmd('forward')">▲ AVANZAR</button><div></div>
    <button onclick="enviarCmd('left')">◄ IZQUIERDA</button>
    <button onclick="enviarCmd('stop')" style="background: #dc2626;">PARAR</button>
    <button onclick="enviarCmd('right')">DERECHA ►</button>
    <div></div><button onclick="enviarCmd('backward')">▼ ATRÁS</button><div></div>
  </div>
</div>

<script>
  let estadoIA = { objetos: false, postura: false, emocion: false };
  let ipBase = "";
  let canvas = null;
  let modelosFaceListos = false;
  let escaneoActivo = false;

  // Constante focal estimada para cámaras web de celular/ESP32 (se ajusta según tu lente)
  // Ancho promedio de un rostro humano = 16 cm
  const ANCHO_ROSTRO_REAL_CM = 16.0; 
  const FOCAL_LENGTH = 500; // Valor de calibración estándar en píxeles

  // Carga local de modelos face-api
  window.addEventListener('DOMContentLoaded', async () => {
    try {
      if (typeof faceapi !== 'undefined') {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri('./models'),
          faceapi.nets.faceLandmark68Net.loadFromUri('./models'),
          faceapi.nets.faceExpressionNet.loadFromUri('./models')
        ]);
        modelosFaceListos = true;
        console.log("Modelos locales e IA cargados.");
      }
    } catch(e) {
      console.error("Error al cargar modelos desde ./models/", e);
    }
  });

  function conectarStream() {
    let entrada = document.getElementById("ipAddress").value.trim();
    if(!entrada) return;
    
    entrada = entrada.replace(/^https?:\/\//, '');
    ipBase = entrada.split('/')[0];

    let img = document.getElementById("mjpegStream");
    img.src = "http://" + entrada;

    img.onload = () => {
      if (!escaneoActivo) {
        escaneoActivo = true;
        loopEscaneo();
      }
    };
  }

  // Bucle asíncrono para mantener procesamiento constante sin saturar CPU
  async function loopEscaneo() {
    if (!escaneoActivo) return;

    const img = document.getElementById('mjpegStream');
    const stage = document.getElementById('stage');

    if (img && img.naturalWidth > 0 && img.naturalHeight > 0) {
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.style.position = 'absolute';
        canvas.style.top = '0';
        canvas.style.left = '0';
        stage.appendChild(canvas);
      }

      const displaySize = { width: img.clientWidth, height: img.clientHeight };
      canvas.width = displaySize.width;
      canvas.height = displaySize.height;

      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let deteccionRostro = false;
      let emocionPredominante = "";
      let distanciaCalculadaCm = 0;

      if (modelosFaceListos && (estadoIA.emocion || estadoIA.postura)) {
        const opcionesTiny = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
        
        try {
          const detections = await faceapi.detectAllFaces(img, opcionesTiny)
                                          .withFaceLandmarks()
                                          .withFaceExpressions();

          const resizedDetections = faceapi.resizeResults(detections, displaySize);

          if (resizedDetections.length > 0) {
            deteccionRostro = true;
            
            // Dibujar bounding box y landmarks
            faceapi.draw.drawDetections(canvas, resizedDetections);
            faceapi.draw.drawFaceLandmarks(canvas, resizedDetections);

            // CÁLCULO MATEMÁTICO DE DISTANCIA
            const box = resizedDetections[0].detection.box;
            const anchoPixeles = box.width;
            
            if (anchoPixeles > 0) {
              distanciaCalculadaCm = Math.round((ANCHO_ROSTRO_REAL_CM * FOCAL_LENGTH) / anchoPixeles);
            }

            // Dibujar etiqueta de distancia sobre la cabeza
            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(`DISTANCIA: ${distanciaCalculadaCm} cm (${(distanciaCalculadaCm/100).toFixed(2)} m)`, box.x, box.y - 10);

            if (estadoIA.emocion) {
              faceapi.draw.drawFaceExpressions(canvas, resizedDetections);
              let exp = resizedDetections[0].expressions;
              emocionPredominante = Object.keys(exp).reduce((a, b) => exp[a] > exp[b] ? a : b);
            }
          }
        } catch (err) {
          console.warn("Cuadro omitido:", err);
        }
      }

      if (estadoIA.objetos) {
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 2;
        let boxWidth = displaySize.width * 0.4;
        let boxHeight = displaySize.height * 0.4;
        let posX = (displaySize.width - boxWidth) / 2;
        let posY = (displaySize.height - boxHeight) / 2;

        ctx.strokeRect(posX, posY, boxWidth, boxHeight);
        ctx.fillStyle = '#22c55e';
        ctx.font = '14px sans-serif';
        ctx.fillText('ZONA DE OBJETOS / ESTRUCTURA LOCAL', posX, posY - 8);
      }

      actualizarBanner(deteccionRostro, emocionPredominante, distanciaCalculadaCm);
    }

    setTimeout(loopEscaneo, 40);
  }

  function actualizarBanner(hayRostro, emocion, distancia) {
    let banner = document.getElementById("bannerAlerta");
    if (!banner) return;

    if (estadoIA.emocion && hayRostro) {
      banner.className = "alert-banner status-red";
      banner.innerText = `🔴 ¡ALERTA ROJA! VÍCTIMA A ${distancia} cm (${(distancia/100).toFixed(2)} m) | EMOCIÓN: ${emocion.toUpperCase()}`;
    } else if (estadoIA.postura && hayRostro) {
      banner.className = "alert-banner status-yellow";
      banner.innerText = `🟡 ALERTA AMARILLA: SUJETO DETECTADO A ${distancia} cm (${(distancia/100).toFixed(2)} m)`;
    } else if (estadoIA.objetos) {
      banner.className = "alert-banner status-green";
      banner.innerText = "🟢 PATRULLAJE Y BÚSQUEDA LOCAL ACTIVADA";
    } else {
      banner.className = "alert-banner status-green";
      banner.innerText = "🟢 ESTADO: PATRULLAJE NORMAL";
    }
  }

  function toggleIA(capa) {
    estadoIA[capa] = !estadoIA[capa];
    let btnId = capa === 'objetos' ? 'btnObj' : (capa === 'postura' ? 'btnPos' : 'btnEmo');
    let btn = document.getElementById(btnId);
    if (btn) {
      btn.classList.toggle('active', estadoIA[capa]);
      btn.innerText = capa.toUpperCase() + (estadoIA[capa] ? " [ON]" : " [OFF]");
    }
  }

  function enviarCmd(dir) {
    if(!ipBase) return;
    fetch("http://" + ipBase + "/cmd?move=" + dir, { mode: 'no-cors' })
      .catch(err => console.log("Comando enviado al robot: " + dir));
  }
</script>

</body>
</html>
