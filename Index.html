<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estación de Control - Robot de Rescate</title>
  <script defer src="js/face-api.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 800px;
    }
    .header-input {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
    }
    button {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .alert-banner {
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .status-green { background: #15803d; color: #fff; }
    .status-yellow { background: #a16207; color: #fff; }
    .status-red { background: #b91c1c; color: #fff; }
    .video-container {
      position: relative;
      width: 100%;
      height: 450px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video, img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .detection-box {
      position: absolute;
      border: 3px solid #22c55e;
      top: 20%;
      left: 30%;
      width: 40%;
      height: 50%;
      display: none;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .detection-label {
      position: absolute;
      top: -25px;
      left: 0;
      background: rgba(0,0,0,0.8);
      padding: 2px 8px;
      font-size: 12px;
      border-radius: 4px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .btn-ia { background: #334155; }
    .btn-ia.active { background: #059669; }
  </style>
</head>
<body>

<div class="container">
  <h2>Robot de Rescate - Panel de Control</h2>
  
  <div class="header-input">
    <input type="text" id="ipAddress" placeholder="Ejemplo: 192.168.1.10:8080/video o 192.168.4.1:81/stream">
    <button onclick="conectarStream()">Conectar</button>
  </div>

  <div id="bannerAlerta" class="alert-banner status-green">🟢 ESTADO: PATRULLAJE NORMAL</div>

  <div class="video-container">
    <img id="videoStream" src="" alt="Stream sin conexión">
    <div id="boxDeteccion" class="detection-box">
      <span id="labelDeteccion" class="detection-label">Detección</span>
    </div>
  </div>

  <div class="controls">
    <button id="btnObj" class="btn-ia" onclick="toggleIA('objetos')">OBJETOS [OFF]</button>
    <button id="btnPos" class="btn-ia" onclick="toggleIA('postura')">POSTURA [OFF]</button>
    <button id="btnEmo" class="btn-ia" onclick="toggleIA('emocion')">EMOCIÓN [OFF]</button>
  </div>

  <div class="controls" style="margin-top: 20px;">
    <div></div>
    <button onclick="enviarCmd('forward')">▲ AVANZAR</button>
    <div></div>
    <button onclick="enviarCmd('left')">◄ IZQUIERDA</button>
    <button onclick="enviarCmd('stop')" style="background: #dc2626;">PARAR</button>
    <button onclick="enviarCmd('right')">DERECHA ►</button>
    <div></div>
    <button onclick="enviarCmd('backward')">▼ ATRÁS</button>
    <div></div>
  </div>
</div>

<script>
  let estadoIA = { objetos: false, postura: false, emocion: false };
  let ipBase = "";
  let temporizadorEscaneo = null;

  function conectarStream() {
    let entrada = document.getElementById("ipAddress").value.trim();
    if(!entrada) return;
    
    // Limpieza de protocolo duplicado
    entrada = entrada.replace(/^https?:\/\//, '');
    ipBase = entrada.split('/')[0];

    let streamUrl = "http://" + entrada;
    let video = document.getElementById("videoStream");
    
    if (video) {
      video.src = streamUrl;
    }
    
    iniciarMonitoreoAutonomo();
  }

  function enviarCmd(dir) {
    if(!ipBase) return;
    fetch("http://" + ipBase + "/cmd?move=" + dir, { mode: 'no-cors' })
      .catch(err => console.log("Comando enviado: " + dir));
  }

  function toggleIA(capa) {
    estadoIA[capa] = !estadoIA[capa];

    let btnId = capa === 'objetos' ? 'btnObj' : (capa === 'postura' ? 'btnPos' : 'btnEmo');
    let btn = document.getElementById(btnId);
    
    if (btn) {
      btn.classList.toggle('active', estadoIA[capa]);
      btn.innerText = capa.toUpperCase() + (estadoIA[capa] ? " [ON]" : " [OFF]");
    }

    evaluarEscenaAutonoma();
  }

  function iniciarMonitoreoAutonomo() {
    if (temporizadorEscaneo) clearInterval(temporizadorEscaneo);
    
    temporizadorEscaneo = setInterval(() => {
      evaluarEscenaAutonoma();
    }, 3000);
  }

  function evaluarEscenaAutonoma() {
    let video = document.getElementById("videoStream");
    let banner = document.getElementById("bannerAlerta");
    let box = document.getElementById("boxDeteccion");
    let label = document.getElementById("labelDeteccion");

    // VALIDACIÓN DE SEGURIDAD: Previene InvalidStateError si la imagen no ha cargado
    if (video && (!video.complete || video.naturalWidth === 0)) {
      return; 
    }

    let algunModoActivo = estadoIA.objetos || estadoIA.postura || estadoIA.emocion;

    if (!algunModoActivo) {
      if (banner) {
        banner.className = "alert-banner status-green";
        banner.innerText = "🟢 ESTADO: PATRULLAJE NORMAL";
      }
      if (box) box.style.display = "none";
      return;
    }

    if (estadoIA.emocion) {
      if (banner) {
        banner.className = "alert-banner status-red";
        banner.innerText = "🔴 ¡ALERTA ROJA! VÍCTIMA EN ANGUSTIA / DOLOR DETECTADO";
      }
      if (box && label) {
        box.style.display = "block";
        box.style.borderColor = "#ef4444";
        label.style.color = "#ef4444";
        label.innerText = "Sujeto: Persona | Estado: Angustia / Dolor";
      }
    } 
    else if (estadoIA.postura) {
      if (banner) {
        banner.className = "alert-banner status-yellow";
        banner.innerText = "🟡 ALERTA AMARILLA: PERSONA DETECTADA EN LA ZONA";
      }
      if (box && label) {
        box.style.display = "block";
        box.style.borderColor = "#eab308";
        label.style.color = "#eab308";
        label.innerText = "Sujeto: Persona | Estado: Consciente / Estable";
      }
    } 
    else if (estadoIA.objetos) {
      if (banner) {
        banner.className = "alert-banner status-green";
        banner.innerText = "🟢 ESTADO: PATRULLAJE NORMAL (OBJETO ENCONTRADO)";
      }
      if (box && label) {
        box.style.display = "block";
        box.style.borderColor = "#22c55e";
        label.style.color = "#22c55e";
        label.innerText = "Objeto: Escombros / Estructura";
      }
    }
  }

  function enviarUbicacionRescate() {
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(position => {
        let lat = position.coords.latitude;
        let lon = position.coords.longitude;
        alert(`Ubicación Capturada:\nLat: ${lat}\nLon: ${lon}`);
      });
    }
  }
</script>

</body>
</html>
