<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
 <title>Estación de Control - Robot de Rescate S3</title>
 <style>
 * { box-sizing: border-box; touch-action: manipulation; }
 body { font-family: Arial, sans-serif; background: #1a202c; color: #fff; margin: 0; padding: 10px; display: flex;
flex-direction: column; align-items: center; } h2 { color: #63b3ed; margin: 5px 0; text-align: center; }
 /* Configuración de IP */
 .config-box { display: flex; gap: 5px; width: 100%; max-width: 480px; margin-bottom: 10px; }
 .config-box input { flex: 1; padding: 8px; border-radius: 4px; border: none; font-size: 14px; }
 .config-box button { background: #3182ce; color: white; border: none; padding: 8px 15px; border-radius: 4px;
font-weight: bold; cursor: pointer; }
 /* Visor de Video y Overlays de IA */
 .video-container { position: relative; width: 100%; max-width: 480px; height: 320px; background: #000;
border-radius: 8px; overflow: hidden; border: 2px solid #4a5568; }
 #videoStream { width: 100%; height: 100%; object-fit: cover; }
 .ai-overlay { position: absolute; top: 10px; left: 10px; right: 10px; pointer-events: none; display: flex;
flex-direction: column; gap: 5px; }
 .alert-banner { padding: 8px; border-radius: 4px; font-weight: bold; text-align: center; font-size: 13px;
text-shadow: 1px 1px 2px #000; }
 .status-green { background: rgba(56, 161, 105, 0.85); color: #fff; }
 .status-yellow { background: rgba(214, 158, 46, 0.85); color: #fff; }
 .status-red { background: rgba(229, 62, 62, 0.9); color: #fff; animation: pulse 1s infinite; }
 @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }
 / Bounding Box Simulado de IA */
 .detection-box {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 3px solid #ef4444;
  background: rgba(239, 68, 68, 0.15);
  box-sizing: border-box;
  display: none;
 }
 .detection-label { position: absolute; top: -20px; left: 0; background: #00ffcc; color: #000; font-size: 10px;
font-weight: bold; padding: 1px 4px; border-radius: 2px; }
 /* Panel de Toggles de IA */
 .ia-controls { width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;
margin: 10px 0; }
 .toggle-btn { background: #4a5568; color: #ccc; border: 1px solid #718096; padding: 8px 2px; border-radius:
5px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
 .toggle-btn.active { background: #319795; color: #fff; border-color: #81e6d9; }
 /* Panel D-Pad de Control de Movimiento */
 .dpad-container { width: 100%; max-width: 300px; display: grid; grid-template-columns: repeat(3, 1fr); gap:
8px; margin-top: 5px; }
 .dpad-btn { background: #2d3748; color: white; border: 2px solid #4a5568; font-size: 20px; font-weight: bold;
height: 60px; border-radius: 8px; display: flex; align-items: center; justify-content: center; user-select: none;
cursor: pointer; }
 .dpad-btn:active { background: #e53e3e; border-color: #feb2b2; }
 .dpad-btn.stop { background: #742a2a; border-color: #9b2c2c; font-size: 14px; }
 /* Botón Alerta GPS */
 .gps-btn { width: 100%; max-width: 480px; margin-top: 10px; background: #dd6b20; color: white; border: none;
padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
 </style></head>
<body>
 <h2>Robot de Rescate ESP32-S3</h2>
 <!-- Configuración IP -->
 <div class="config-box">
 <input type="text" id="ipAddress" value="192.168.4.1" placeholder="IP del Robot (ej. 192.168.4.1)">
 <button onclick="conectarStream()">Conectar</button>
 </div>
 <!-- Visor de Transmisión -->
 <div class="video-container">
 <img id="videoStream" src="" alt="Stream sin conexión" onerror="this.src='';">
 <div class="ai-overlay">
 <div id="bannerAlerta" class="alert-banner status-green">ESTADO: PATRULLAJE NORMAL</div>
 </div>
 <!-- Cuadro de Detección de IA -->
 <div id="boxDeteccion" class="detection-box" style="top: 25%; left: 30%; width: 40%; height: 50%;">
 <span id="labelDeteccion" class="detection-label">Sujeto: Persona</span>
 </div>
 </div>
 <!-- Botones para Activar/Desactivar Capas de IA -->
 <div class="ia-controls">
 <button id="btnObj" class="toggle-btn" onclick="toggleIA('objetos')">OBJETOS [OFF]</button>
 <button id="btnPos" class="toggle-btn" onclick="toggleIA('postura')">POSTURA [OFF]</button>
 <button id="btnEmo" class="toggle-btn" onclick="toggleIA('emocion')">EMOCIONES [OFF]</button>
 </div>
 <!-- Panel de Control D-Pad -->
 <div class="dpad-container">
 <div></div>
 <div class="dpad-btn" onmousedown="enviarCmd('fwd')" onmouseup="enviarCmd('stop')"
ontouchstart="enviarCmd('fwd')" ontouchend="enviarCmd('stop')">▲</div>
 <div></div>
 <div class="dpad-btn" onmousedown="enviarCmd('left')" onmouseup="enviarCmd('stop')"
ontouchstart="enviarCmd('left')" ontouchend="enviarCmd('stop')">◄</div>
 <div class="dpad-btn stop" onclick="enviarCmd('stop')">PARAR</div>
 <div class="dpad-btn" onmousedown="enviarCmd('right')" onmouseup="enviarCmd('stop')"
ontouchstart="enviarCmd('right')" ontouchend="enviarCmd('stop')">►</div>
 <div></div>
 <div class="dpad-btn" onmousedown="enviarCmd('back')" onmouseup="enviarCmd('stop')"
ontouchstart="enviarCmd('back')" ontouchend="enviarCmd('stop')">▼</div>
 <div></div>
 </div>
 <!-- Botón para Enviar Ubicación GPS --> <button class="gps-btn" onclick="enviarUbicacionRescate()">📍 TRANSMITIR COORDENADAS DE
RESCATE</button>
<!-- Librerías locales precargadas para visión artificial -->
<script src="js/face-api.min.js"></script>

<script>
  let estadoIA = { objetos: false, postura: false, emocion: false };
  let ipBase = "192.168.4.1";
  let modelosCargados = false;
  let intervaloRostros = null;

  const video = document.getElementById("videoStream");

  // Cargar modelos locales de detección facial al iniciar
  Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri('./models'),
    faceapi.nets.faceLandmark68Net.loadFromUri('./models'),
    faceapi.nets.faceExpressionNet.loadFromUri('./models')
  ]).then(() => {
    modelosCargados = true;
    console.log("Modelos de detección facial listos.");
  });

  function conectarStream() {
    ipBase = document.getElementById("ipAddress").value.trim();
    video.crossOrigin = "anonymous";
    video.src = "http://" + ipBase + ":81/stream";
  }

  function toggleIA(capa) {
    estadoIA[capa] = !estadoIA[capa];

    let btnId = capa === 'objetos' ? 'btnObj' : (capa === 'postura' ? 'btnPos' : 'btnEmo');
    let btn = document.getElementById(btnId);
    
    if (btn) {
      btn.classList.toggle('active', estadoIA[capa]);
      btn.innerText = capa.toUpperCase() + (estadoIA[capa] ? " [ON]" : " [OFF]");
    }

    if (estadoIA.emocion) {
      iniciarDeteccionEmociones();
    } else {
      if (intervaloRostros) clearInterval(intervaloRostros);
      evaluarEscenaEstatica();
    }
  }

  function iniciarDeteccionEmociones() {
    if (intervaloRostros) clearInterval(intervaloRostros);

    // Analiza la cara cada 200 ms para mantener el video fluido
    intervaloRostros = setInterval(async () => {
      if (!modelosCargados || !estadoIA.emocion) return;

      const detecciones = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                                       .withFaceLandmarks()
                                       .withFaceExpressions();

      let banner = document.getElementById("bannerAlerta");
      let box = document.getElementById("boxDeteccion");
      let label = document.getElementById("labelDeteccion");

      // Ajuste del cuadro al 100% de la pantalla
      box.style.top = "0";
      box.style.left = "0";
      box.style.width = "100%";
      box.style.height = "100%";

      if (detecciones.length > 0) {
        // Extraer la emoción con mayor porcentaje de probabilidad
        const expresiones = detecciones[0].expressions;
        const emocionDominante = Object.keys(expresiones).reduce((a, b) => expresiones[a] > expresiones[b] ? a : b);
        const certeza = Math.round(expresiones[emocionDominante] * 100);

        // Traducción de emociones detectadas
        const traduccionEmociones = {
          sad: "Tristeza / Dolor",
          fearful: "Miedo / Angustia",
          angry: "Frustración / Agitación",
          surprised: "Sorprendido / Alerta",
          happy: "Consciente / Calmo",
          disgusted: "Malestar General",
          neutral: "Estable / Neutro"
        };

        let emocionTraducida = traduccionEmociones[emocionDominante] || "Desconocido";

        // Clasificación de severidad según el estado detectado
        if (["sad", "fearful", "angry", "disgusted"].includes(emocionDominante)) {
          banner.className = "alert-banner status-red";
          banner.innerText = `🔴 ¡ALERTA ROJA! VÍCTIMA EN ANGUSTIA (${emocionTraducida.toUpperCase()} ${certeza}%)`;
          box.style.borderColor = "#ef4444";
          label.style.backgroundColor = "#ef4444";
          label.style.color = "#fff";
        } else {
          banner.className = "alert-banner status-yellow";
          banner.innerText = `🟡 ALERTA AMARILLA: PERSONA ESTABLE (${emocionTraducida.toUpperCase()} ${certeza}%)`;
          box.style.borderColor = "#eab308";
          label.style.backgroundColor = "#eab308";
          label.style.color = "#000";
        }

        box.style.display = "block";
        label.innerText = `Rostro Detectado: ${emocionTraducida} (${certeza}% precisión)`;
      } else {
        // Si el botón está activado pero no hay nadie en cámara
        banner.className = "alert-banner status-yellow";
        banner.innerText = "🟡 ESCANEANDO FACIALMENTE: BUSCANDO ROSTROS...";
        box.style.display = "none";
      }
    }, 200);
  }

  function evaluarEscenaEstatica() {
    let banner = document.getElementById("bannerAlerta");
    let box = document.getElementById("boxDeteccion");
    let label = document.getElementById("labelDeteccion");

    if (!estadoIA.objetos && !estadoIA.postura) {
      banner.className = "alert-banner status-green";
      banner.innerText = "🟢 ESTADO: PATRULLAJE NORMAL";
      box.style.display = "none";
      return;
    }

    box.style.top = "0";
    box.style.left = "0";
    box.style.width = "100%";
    box.style.height = "100%";

    if (estadoIA.postura) {
      banner.className = "alert-banner status-yellow";
      banner.innerText = "🟡 ALERTA AMARILLA: PERSONA DETECTADA EN LA ZONA";
      box.style.display = "block";
      box.style.borderColor = "#eab308";
      label.style.backgroundColor = "#eab308";
      label.style.color = "#000";
      label.innerText = "Sujeto: Persona | Postura: Detectada";
    } else if (estadoIA.objetos) {
      banner.className = "alert-banner status-green";
      banner.innerText = "🟢 ESTADO: PATRULLAJE NORMAL (OBSTÁCULO)";
      box.style.display = "block";
      box.style.borderColor = "#22c55e";
      label.style.backgroundColor = "#22c55e";
      label.style.color = "#000";
      label.innerText = "Objeto Identificado: Obstáculo de Ruta";
    }
  }

  function enviarCmd(dir) {
    if (!ipBase) return;
    fetch("http://" + ipBase + "/cmd?move=" + dir, { mode: 'no-cors' })
      .catch(err => console.log("Comando enviado: " + dir));
  }
</script>
</body>
</html>
