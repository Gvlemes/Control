<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estación de Control - Robot de Rescate</title>
  <script defer src="js/face-api.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 1000px;
    }
    .header-input {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
    }
    button {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .alert-banner {
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .status-green { background: #15803d; color: #fff; }
    .status-yellow { background: #a16207; color: #fff; }
    .status-red { background: #b91c1c; color: #fff; }
    
    /* Contenedor ampliado para pantalla grande */
    .video-container {
      position: relative;
      width: 100%;
      min-height: 500px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #videoStream {
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      display: block;
    }
    /* Canvas superpuesto exacto al tamaño del video */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .btn-ia { background: #334155; }
    .btn-ia.active { background: #059669; }
  </style>
</head>
<body>

<div class="container">
  <h2>Robot de Rescate - Panel de Control</h2>
  
  <div class="header-input">
    <input type="text" id="ipAddress" placeholder="Ejemplo: 192.168.1.10:8080/video">
    <button onclick="conectarStream()">Conectar</button>
  </div>

  <div id="bannerAlerta" class="alert-banner status-green">🟢 ESTADO: PATRULLAJE NORMAL</div>

  <div class="video-container" id="stage">
    <img id="videoStream" src="" crossorigin="anonymous" alt="Esperando señal de video...">
  </div>

  <div class="controls">
    <button id="btnObj" class="btn-ia" onclick="toggleIA('objetos')">OBJETOS [OFF]</button>
    <button id="btnPos" class="btn-ia" onclick="toggleIA('postura')">POSTURA [OFF]</button>
    <button id="btnEmo" class="btn-ia" onclick="toggleIA('emocion')">EMOCIÓN [OFF]</button>
  </div>

  <div class="controls" style="margin-top: 20px;">
    <div></div>
    <button onclick="enviarCmd('forward')">▲ AVANZAR</button>
    <div></div>
    <button onclick="enviarCmd('left')">◄ IZQUIERDA</button>
    <button onclick="enviarCmd('stop')" style="background: #dc2626;">PARAR</button>
    <button onclick="enviarCmd('right')">DERECHA ►</button>
    <div></div>
    <button onclick="enviarCmd('backward')">▼ ATRÁS</button>
    <div></div>
  </div>
</div>

<script>
  let estadoIA = { objetos: false, postura: false, emocion: false };
  let ipBase = "";
  let temporizadorIA = null;
  let canvasIA = null;

  // Cargar modelos de face-api al abrir
  window.onload = async () => {
    if (typeof faceapi !== 'undefined') {
      await faceapi.nets.tinyFaceDetector.loadFromUri('./models');
      await faceapi.nets.faceExpressionNet.loadFromUri('./models');
      console.log("Modelos de IA cargados en memoria");
    }
  };

  function conectarStream() {
    let entrada = document.getElementById("ipAddress").value.trim();
    if(!entrada) return;
    
    entrada = entrada.replace(/^https?:\/\//, '');
    ipBase = entrada.split('/')[0];

    let streamUrl = "http://" + entrada;
    let img = document.getElementById("videoStream");
    
    if (img) {
      img.src = streamUrl;
      img.onload = () => iniciarProcesamientoIA();
    }
  }

  function iniciarProcesamientoIA() {
    let img = document.getElementById("videoStream");
    let stage = document.getElementById("stage");

    // Crear o reutilizar Canvas superpuesto
    if (!canvasIA) {
      canvasIA = faceapi.createCanvasFromMedia(img);
      stage.appendChild(canvasIA);
    }

    if (temporizadorIA) clearInterval(temporizadorIA);

    temporizadorIA = setInterval(async () => {
      // Validar dimensiones reales antes de procesar
      if (!img.complete || img.naturalWidth === 0) return;

      const displaySize = { width: img.clientWidth, height: img.clientHeight };
      faceapi.matchDimensions(canvasIA, displaySize);

      const ctx = canvasIA.getContext('2d');
      ctx.clearRect(0, 0, canvasIA.width, canvasIA.height);

      let deteccionRostro = false;

      // 1. Detección Facial / Emociones si EMOCION o POSTURA están activos
      if ((estadoIA.emocion || estadoIA.postura) && typeof faceapi !== 'undefined') {
        const detections = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
        const resizedDetections = faceapi.resizeResults(detections, displaySize);

        if (resizedDetections.length > 0) {
          deteccionRostro = true;
          faceapi.draw.drawDetections(canvasIA, resizedDetections);
          
          if (estadoIA.emocion) {
            faceapi.draw.drawFaceExpressions(canvasIA, resizedDetections);
          }
        }
      }

      // 2. Detección Simulada de Objetos / Estructuras si OBJETOS está activo
      if (estadoIA.objetos) {
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 3;
        // Dibuja cuadro en el centro de la toma
        let w = displaySize.width * 0.4;
        let h = displaySize.height * 0.4;
        let x = (displaySize.width - w) / 2;
        let y = (displaySize.height - h) / 2;
        
        ctx.strokeRect(x, y, w, h);
        ctx.fillStyle = '#22c55e';
        ctx.font = '16px sans-serif';
        ctx.fillText('Estructura / Escombros [89%]', x, y - 8);
      }

      // Actualizar Barra de Estado
      actualizarBanner(deteccionRostro);

    }, 200); // Procesa cada 200ms para tiempo real fluido
  }

  function actualizarBanner(hayRostro) {
    let banner = document.getElementById("bannerAlerta");
    if (!banner) return;

    if (estadoIA.emocion && hayRostro) {
      banner.className = "alert-banner status-red";
      banner.innerText = "🔴 ¡ALERTA ROJA! VÍCTIMA DETECTADA EN LA ZONA";
    } else if (estadoIA.postura && hayRostro) {
      banner.className = "alert-banner status-yellow";
      banner.innerText = "🟡 ALERTA AMARILLA: SUJETO DETECTADO EN LA ZONA";
    } else if (estadoIA.objetos) {
      banner.className = "alert-banner status-green";
      banner.innerText = "🟢 ESTADO: PATRULLAJE NORMAL (OBJETO ENCONTRADO)";
    } else {
      banner.className = "alert-banner status-green";
      banner.innerText = "🟢 ESTADO: PATRULLAJE NORMAL";
    }
  }

  function toggleIA(capa) {
    estadoIA[capa] = !estadoIA[capa];

    let btnId = capa === 'objetos' ? 'btnObj' : (capa === 'postura' ? 'btnPos' : 'btnEmo');
    let btn = document.getElementById(btnId);
    
    if (btn) {
      btn.classList.toggle('active', estadoIA[capa]);
      btn.innerText = capa.toUpperCase() + (estadoIA[capa] ? " [ON]" : " [OFF]");
    }
  }

  function enviarCmd(dir) {
    if(!ipBase) return;
    fetch("http://" + ipBase + "/cmd?move=" + dir, { mode: 'no-cors' })
      .catch(err => console.log("Comando enviado: " + dir));
  }
</script>

</body>
</html>
